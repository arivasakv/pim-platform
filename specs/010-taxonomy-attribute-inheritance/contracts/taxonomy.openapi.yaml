openapi: 3.1.0
info:
  title: PIM Platform – Product taxonomy and attribute inheritance
  version: 1.2.0
  description: >
    Feature 010 (specs/010-taxonomy-attribute-inheritance). The product hierarchy (ERF 1.1 §3.3):
    nodes with one parent, created, renamed and deleted when empty; attributes (feature 004) assigned
    directly to nodes and inherited by every descendant. The detail of a node returns its effective
    attributes, each once, with its assignment type and origin, computed from the current tree on
    every read. Changes need the ATTRIBUTE_CREATE permission (development header X-Pim-Permissions,
    as in features 004–007); reading needs none. Node system IDs come from feature 003 (object type
    CLASSIFICATION). Data is stored in MongoDB (ADR 0003, constitution 2.5.0). Unknown fields in
    request bodies are ignored. Messages are in Spanish. Errors are RFC 9457 problems with `errors[]`
    entries {field, code, message} (ADR 0001).
    Version 1.1.0 (feature 011, specs/011-taxonomy-node-relocation): adds POST
    /api/v1/taxonomy-nodes/{nodeId}/move, which moves a node with its whole branch under another node or
    to the top level (ERF 1.1 §3.3 «Reubicación de Nodos»). Nothing else changes; PUT still never changes
    the parent.
    Version 1.2.0 (feature 012, specs/012-taxonomy-list-value-filters): adds list-value filters per node
    (GET/PUT/DELETE /api/v1/taxonomy-nodes/{nodeId}/value-filters/{attributeId}) and the listAttributes
    field of TaxonomyNode. A filter is the set of a list attribute's values allowed at a node; the values
    allowed at a node are those included in every filter on the node and its ancestors (ERF 1.1 §3.2.3, §3.3).
    Data stored in MongoDB per constitution 2.6.0 and ADR 0003.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: taxonomy-nodes
paths:
  /api/v1/taxonomy-nodes:
    get:
      operationId: listTaxonomyNodes
      summary: Every node as a flat list, sorted by name (ignoring letter case) within each parent (FR-018)
      tags: [taxonomy-nodes]
      responses:
        '200':
          description: All nodes; the client nests them by `parentId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNodeCollection' }
    post:
      operationId: createTaxonomyNode
      summary: Create a top-level node or a child of an existing node (FR-001 to FR-004)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyNodeCreateRequest' }
            example: { name: Ropa de hombre, description: null, parentId: CLS000001 }
      responses:
        '201':
          description: Created, with a generated CLASSIFICATION system ID and no direct attributes.
          headers:
            Location: { schema: { type: string }, description: '/api/v1/taxonomy-nodes/{systemId}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404':
          description: The parent does not exist (`NODE_NOT_FOUND`, field parentId). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/NameInUse' }
  /api/v1/taxonomy-nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      operationId: getTaxonomyNode
      summary: One node with its path, children and effective attributes (FR-007, FR-012 to FR-016)
      tags: [taxonomy-nodes]
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNode' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTaxonomyNode
      summary: Rename the node and replace its description; parent, ID, children and assignments stay (FR-005)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyNodeUpdateRequest' }
      responses:
        '200':
          description: The updated node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxonomyNode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameInUse' }
    delete:
      operationId: deleteTaxonomyNode
      summary: Delete a node with no children and no direct attributes (FR-006)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The node has children (`NODE_HAS_CHILDREN`) or direct attributes (`NODE_HAS_ATTRIBUTES`). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                children:
                  value:
                    title: Nodo con nodos hijos
                    status: 409
                    detail: El nodo «Ropa» tiene 1 nodo hijo. Elimínalo antes de eliminar este nodo.
                    errors:
                      - { field: nodeId, code: NODE_HAS_CHILDREN, message: El nodo «Ropa» tiene 1 nodo hijo. Elimínalo antes de eliminar este nodo. }
                attributes:
                  value:
                    title: Nodo con atributos
                    status: 409
                    detail: El nodo «Camisas» tiene 1 atributo asignado. Quítalo antes de eliminar el nodo.
                    errors:
                      - { field: nodeId, code: NODE_HAS_ATTRIBUTES, message: El nodo «Camisas» tiene 1 atributo asignado. Quítalo antes de eliminar el nodo. }
  /api/v1/taxonomy-nodes/{nodeId}/attributes:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: assignAttributesToNode
      summary: Assign existing attributes directly to the node, all or nothing (FR-008, FR-009, FR-011)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignAttributesRequest' }
      responses:
        '200':
          description: Assigned; IDs already direct on the node are reported in `alreadyAssigned`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignAttributesResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: An attribute does not exist (`ATTRIBUTE_NOT_FOUND`, field attributeIds); nothing assigned.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/v1/taxonomy-nodes/{nodeId}/attributes/{attributeId}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - name: attributeId
        in: path
        required: true
        schema: { type: string, maxLength: 40 }
    delete:
      operationId: removeAttributeFromNode
      summary: Remove a direct assignment; descendants stop inheriting it from this node (FR-010)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      responses:
        '204': { description: Removed. The attribute itself is unchanged. }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404':
          description: The node does not exist (`NODE_NOT_FOUND`), or the attribute is neither direct nor inherited on it (`ATTRIBUTE_NOT_ON_NODE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The attribute is only inherited here (`ATTRIBUTE_NOT_DIRECT`); the message names the origin node. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Atributo heredado
                status: 409
                detail: El atributo «Color» se hereda de «Ropa». Quítalo en ese nodo.
                errors:
                  - { field: attributeId, code: ATTRIBUTE_NOT_DIRECT, message: El atributo «Color» se hereda de «Ropa». Quítalo en ese nodo. }
  /api/v1/taxonomy-nodes/{nodeId}/move:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      operationId: moveTaxonomyNode
      summary: Move a node, with its whole branch, under another node or to the top level (feature 011 FR-001 to FR-009)
      description: >
        Only the node's parent changes; its descendants follow. IDs, names, descriptions, children and direct
        attributes stay. Levels, paths and effective attributes of the branch reflect the new ancestors on the
        next read. No depth limit applies.
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveNodeRequest' }
            examples:
              underAnotherNode:
                value: { parentId: CLS000005 }
              toTopLevel:
                value: { parentId: null }
      responses:
        '200':
          description: Moved. The node detail reflects its new level, path and effective attributes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveNodeResult' }
        '400':
          description: '`parentId` longer than 40 characters (`NODE_NOT_FOUND`, field parentId, "El ID del nodo padre no es válido."). Nothing changed.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404':
          description: The node (`NODE_NOT_FOUND`, field nodeId) or the destination (`NODE_NOT_FOUND`, field parentId) does not exist. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Nodo no encontrado
                status: 404
                detail: No existe un nodo con el ID CLS000099.
                errors:
                  - { field: parentId, code: NODE_NOT_FOUND, message: No existe un nodo con el ID CLS000099. }
        '409':
          description: >
            The move conflicts with the current tree; nothing changed. `NODE_MOVE_INTO_OWN_BRANCH`: the
            destination is the node or one of its descendants. `NODE_ALREADY_THERE`: the destination is the
            current parent (or the top level for a top-level node). `NODE_NAME_IN_USE`: the destination
            already has a child with the node's name, ignoring letter case and surrounding spaces.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                ownBranch:
                  value:
                    title: Movimiento no válido
                    status: 409
                    detail: No puedes mover «Ropa de hombre» dentro de sí mismo ni de uno de sus nodos descendientes.
                    errors:
                      - { field: parentId, code: NODE_MOVE_INTO_OWN_BRANCH, message: No puedes mover «Ropa de hombre» dentro de sí mismo ni de uno de sus nodos descendientes. }
                alreadyThere:
                  value:
                    title: Movimiento sin efecto
                    status: 409
                    detail: «Camisas» ya está en «Ropa de hombre».
                    errors:
                      - { field: parentId, code: NODE_ALREADY_THERE, message: «Camisas» ya está en «Ropa de hombre». }
                alreadyTopLevel:
                  value:
                    title: Movimiento sin efecto
                    status: 409
                    detail: «Ropa» ya está en el primer nivel.
                    errors:
                      - { field: parentId, code: NODE_ALREADY_THERE, message: «Ropa» ya está en el primer nivel. }
                nameInUse:
                  value:
                    title: Nombre en uso
                    status: 409
                    detail: Ya existe un nodo «Camisas» en «Ropa de mujer». Cambia el nombre de uno de los dos antes de mover.
                    errors:
                      - { field: parentId, code: NODE_NAME_IN_USE, message: Ya existe un nodo «Camisas» en «Ropa de mujer». Cambia el nombre de uno de los dos antes de mover. }
                nameInUseTopLevel:
                  value:
                    title: Nombre en uso
                    status: 409
                    detail: Ya existe un nodo «Calzado» en el primer nivel. Cambia el nombre de uno de los dos antes de mover.
                    errors:
                      - { field: parentId, code: NODE_NAME_IN_USE, message: Ya existe un nodo «Calzado» en el primer nivel. Cambia el nombre de uno de los dos antes de mover. }
  /api/v1/taxonomy-nodes/{nodeId}/value-filters/{attributeId}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - name: attributeId
        in: path
        required: true
        description: System ID of a list-of-values attribute that applies to the node, compared ignoring letter case.
        schema: { type: string, maxLength: 40 }
    get:
      operationId: getValueFilter
      summary: The list attribute's values at this node, its own filter and the filters above (FR-008 to FR-013)
      tags: [taxonomy-nodes]
      responses:
        '200':
          description: The filter detail (also when the node has no filter of its own).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueFilterDetail' }
        '404':
          description: Node (`NODE_NOT_FOUND`), attribute (`ATTRIBUTE_NOT_FOUND`) or attribute not applying to the node (`ATTRIBUTE_NOT_ON_NODE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The attribute is not a list of values (`ATTRIBUTE_NOT_LIST`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: saveValueFilter
      summary: Define or replace the node's filter for the attribute (FR-001 to FR-004, FR-009)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueFilterRequest' }
            example: { valueIds: ['0002', '0004', '0005', '0001'] }
      responses:
        '200':
          description: Saved; the detail after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueFilterDetail' }
        '400':
          description: No value ID or more than 50,000 (`INVALID_FILTER_VALUES`, field valueIds), or no `valueIds` field (`REQUIRED`, as the other taxonomy requests). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Solicitud no válida
                status: 400
                detail: La solicitud tiene datos no válidos.
                errors:
                  - { field: valueIds, code: INVALID_FILTER_VALUES, message: Incluye de 1 a 50000 valores en el filtro. Para permitir todos los valores, quita el filtro. }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404':
          description: Node, attribute, or attribute not applying to the node (as GET). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: A value is excluded by a filter above (`VALUE_EXCLUDED_ABOVE`, field valueIds); the message names the value and the node. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Valor excluido arriba
                status: 409
                detail: El valor «Verde» (0003) no está permitido por el filtro de «Ropa de hombre». Solo puedes incluir valores permitidos arriba.
                errors:
                  - { field: valueIds, code: VALUE_EXCLUDED_ABOVE, message: El valor «Verde» (0003) no está permitido por el filtro de «Ropa de hombre». Solo puedes incluir valores permitidos arriba. }
        '422':
          description: The attribute is not a list (`ATTRIBUTE_NOT_LIST`, field attributeId) or a value ID is not in its list (`VALUE_NOT_IN_LIST`, field valueIds). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notList:
                  value:
                    title: Atributo sin lista de valores
                    status: 422
                    detail: El atributo «Largo de manga» no es de tipo lista de valores; solo esos atributos se filtran.
                    errors:
                      - { field: attributeId, code: ATTRIBUTE_NOT_LIST, message: El atributo «Largo de manga» no es de tipo lista de valores; solo esos atributos se filtran. }
                notInList:
                  value:
                    title: Valor no encontrado
                    status: 422
                    detail: La lista «Colores» no tiene un valor con el ID 9999.
                    errors:
                      - { field: valueIds, code: VALUE_NOT_IN_LIST, message: La lista «Colores» no tiene un valor con el ID 9999. }
    delete:
      operationId: removeValueFilter
      summary: Remove the node's filter; the node allows the values inherited from above (FR-005)
      tags: [taxonomy-nodes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/NotPermitted' }
        '404':
          description: Node or attribute not found, or the node has no filter for the attribute (`FILTER_NOT_FOUND`, field attributeId).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Node system ID, compared ignoring letter case.
      schema: { type: string, maxLength: 40 }
    Permissions:
      name: X-Pim-Permissions
      in: header
      required: false
      description: Development stand-in for the user's permissions (feature 004, research R-06). ATTRIBUTE_CREATE allows changes.
      schema: { type: string, example: ATTRIBUTE_CREATE }
  responses:
    InvalidRequest:
      description: Invalid request (`INVALID_NODE_NAME`, `INVALID_NODE_DESCRIPTION`, `INVALID_ATTRIBUTE_IDS`). Nothing changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: Solicitud no válida
            status: 400
            detail: La solicitud tiene datos no válidos.
            errors:
              - { field: name, code: INVALID_NODE_NAME, message: El nombre del nodo debe tener de 1 a 80 caracteres. }
    NotPermitted:
      description: No ATTRIBUTE_CREATE permission (`TAXONOMY_CHANGE_NOT_PERMITTED`). Nothing changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: Sin permiso para administrar la taxonomía
            status: 403
            detail: No tienes permiso para administrar la taxonomía.
            errors:
              - { field: permissions, code: TAXONOMY_CHANGE_NOT_PERMITTED, message: No tienes permiso para administrar la taxonomía. }
    NotFound:
      description: The node does not exist (`NODE_NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: Nodo no encontrado
            status: 404
            detail: No existe un nodo con el ID CLS000099.
            errors:
              - { field: nodeId, code: NODE_NOT_FOUND, message: No existe un nodo con el ID CLS000099. }
    NameInUse:
      description: A sibling already has the name, ignoring letter case and surrounding spaces (`NODE_NAME_IN_USE`). Nothing changed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: Nombre en uso
            status: 409
            detail: Ya existe un nodo «Ropa de hombre» en este nivel. Usa otro nombre.
            errors:
              - { field: name, code: NODE_NAME_IN_USE, message: Ya existe un nodo «Ropa de hombre» en este nivel. Usa otro nombre. }
  schemas:
    TaxonomyNodeCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200, description: 'Trimmed; 1–80 characters; unique among siblings ignoring letter case' }
        description: { type: [string, 'null'], maxLength: 1000, description: 'Trimmed; up to 500 characters' }
        parentId: { type: [string, 'null'], maxLength: 40, description: 'Parent system ID; null or absent for a top-level node' }
    TaxonomyNodeUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 1000 }
    AssignAttributesRequest:
      type: object
      required: [attributeIds]
      properties:
        attributeIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, maxLength: 40 }
    NodeReference:
      type: object
      required: [systemId, name]
      properties:
        systemId: { type: string, example: CLS000001 }
        name: { type: string, example: Ropa }
    TaxonomyNodeSummary:
      type: object
      required: [systemId, name, level, directAttributeCount, childCount]
      properties:
        systemId: { type: string }
        name: { type: string }
        parentId: { type: [string, 'null'] }
        level: { type: integer, minimum: 1, description: '1 for top-level nodes' }
        directAttributeCount: { type: integer, minimum: 0 }
        childCount: { type: integer, minimum: 0 }
    TaxonomyNodeCollection:
      type: object
      description: Project-wide collection envelope (docs/decisions/0001-api-conventions.md).
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaxonomyNodeSummary' }
        total: { type: integer }
    EffectiveAttribute:
      type: object
      required: [systemId, displayName, dataType, assignment, origin]
      properties:
        systemId: { type: string, example: ATR000001 }
        displayName: { type: string, example: Color }
        dataType: { type: string, example: LIST_OF_VALUES, description: Feature 004 data type code }
        assignment:
          type: string
          enum: [DIRECT, INHERITED]
          description: DIRECT if assigned to this node; otherwise INHERITED from an ancestor (FR-014)
        origin:
          $ref: '#/components/schemas/NodeReference'
          description: This node for DIRECT; the nearest ancestor with a direct assignment for INHERITED
        alsoInheritedFrom:
          description: Only for DIRECT entries that an ancestor also has directly; the nearest such ancestor
          oneOf:
            - $ref: '#/components/schemas/NodeReference'
            - type: 'null'
    TaxonomyNode:
      type: object
      required: [systemId, name, level, path, children, directAttributeCount, effectiveAttributes, listAttributes, createdAt]
      properties:
        systemId: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        parentId: { type: [string, 'null'] }
        level: { type: integer, minimum: 1 }
        path:
          type: array
          description: Ancestors from the top level down to the parent; empty for a top-level node
          items: { $ref: '#/components/schemas/NodeReference' }
        children:
          type: array
          description: Direct children sorted by name ignoring letter case
          items: { $ref: '#/components/schemas/NodeReference' }
        directAttributeCount: { type: integer, minimum: 0 }
        effectiveAttributes:
          type: array
          description: >
            Each attribute once (FR-013). INHERITED entries first, grouped by origin from the top level
            down; DIRECT entries last; within one origin, in assignment order (FR-016).
          items: { $ref: '#/components/schemas/EffectiveAttribute' }
        listAttributes:
          type: array
          description: Feature 012. Every effective list-of-values attribute of the node, in effective-attribute order, with its allowed values and the filters involved (FR-013).
          items: { $ref: '#/components/schemas/ListAttribute' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    AssignAttributesResult:
      type: object
      required: [node, added, alreadyAssigned]
      properties:
        node: { $ref: '#/components/schemas/TaxonomyNode' }
        added: { type: array, items: { type: string } }
        alreadyAssigned: { type: array, items: { type: string } }
    MoveNodeRequest:
      type: object
      description: Feature 011.
      properties:
        parentId:
          type: [string, 'null']
          maxLength: 40
          description: >
            System ID of the new parent, compared ignoring letter case. `null` or absent moves the node to the
            top level (same meaning as in TaxonomyNodeCreateRequest).
    MoveNodeResult:
      type: object
      description: Feature 011.
      required: [node, movedNodeCount]
      properties:
        node: { $ref: '#/components/schemas/TaxonomyNode' }
        movedNodeCount:
          type: integer
          minimum: 1
          description: The moved node plus all its descendants.
    ValueFilterRequest:
      type: object
      required: [valueIds]
      properties:
        valueIds:
          type: array
          minItems: 1
          maxItems: 50000
          items: { type: string, maxLength: 40 }
          description: Value IDs of the attribute's list to include, compared ignoring letter case; repeats are ignored.
    ListValue:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: '0002' }
        label: { type: string, example: Azul }
    FilterOnPath:
      type: object
      required: [node, includedCount]
      properties:
        node: { $ref: '#/components/schemas/NodeReference' }
        includedCount: { type: integer, minimum: 1, description: Values included in that filter (still in the list) }
    ExcludedValue:
      type: object
      required: [id, label, excludedBy]
      properties:
        id: { type: string }
        label: { type: string }
        excludedBy: { $ref: '#/components/schemas/NodeReference' }
    ListAttribute:
      type: object
      description: One list-of-values attribute that applies to the node (added to TaxonomyNode as `listAttributes`).
      required: [systemId, displayName, listOfValuesId, listName, selectionMode, totalValues, allowedCount, hasOwnFilter, filters]
      properties:
        systemId: { type: string, example: ATR000001 }
        displayName: { type: string, example: Color }
        listOfValuesId: { type: string, example: LOV000001 }
        listName: { type: string, example: Colores }
        selectionMode: { type: string, enum: [SINGLE, MULTIPLE] }
        totalValues: { type: integer, minimum: 0 }
        allowedCount: { type: integer, minimum: 0 }
        hasOwnFilter: { type: boolean }
        filters:
          type: array
          description: Filters on the node and its ancestors for this attribute, from the top level down; empty when none.
          items: { $ref: '#/components/schemas/FilterOnPath' }
    ValueFilterDetail:
      type: object
      required: [node, attribute, totalValues, availableValues, excludedAboveValues, allowedValues, filters]
      properties:
        node: { $ref: '#/components/schemas/NodeReference' }
        attribute: { $ref: '#/components/schemas/ListAttribute' }
        totalValues: { type: integer, minimum: 0 }
        availableValues:
          type: array
          description: Values allowed by the filters above this node (what its own filter may include), in list order.
          items: { $ref: '#/components/schemas/ListValue' }
        includedValueIds:
          type: [array, 'null']
          description: The node's own filter, in list order; null when it has none.
          items: { type: string }
        excludedAboveValues:
          type: array
          description: Values of the node's own filter that a filter above no longer allows (FR-010).
          items: { $ref: '#/components/schemas/ExcludedValue' }
        allowedValues:
          type: array
          description: Values allowed at this node, in list order (FR-008). Empty with filters present means no value is allowed (FR-011).
          items: { $ref: '#/components/schemas/ListValue' }
        filters:
          type: array
          items: { $ref: '#/components/schemas/FilterOnPath' }
    Problem:
      type: object
      description: RFC 9457 problem (ADR 0001).
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code:
                type: string
                enum:
                  - REQUIRED
                  - INVALID_NODE_NAME
                  - INVALID_NODE_DESCRIPTION
                  - INVALID_ATTRIBUTE_IDS
                  - TAXONOMY_CHANGE_NOT_PERMITTED
                  - NODE_NOT_FOUND
                  - NODE_NAME_IN_USE
                  - NODE_MOVE_INTO_OWN_BRANCH
                  - NODE_ALREADY_THERE
                  - INVALID_FILTER_VALUES
                  - ATTRIBUTE_NOT_LIST
                  - VALUE_NOT_IN_LIST
                  - VALUE_EXCLUDED_ABOVE
                  - FILTER_NOT_FOUND
                  - NODE_HAS_CHILDREN
                  - NODE_HAS_ATTRIBUTES
                  - ATTRIBUTE_NOT_FOUND
                  - ATTRIBUTE_NOT_DIRECT
                  - ATTRIBUTE_NOT_ON_NODE
                  - STORAGE_UNAVAILABLE
              message: { type: string }
