openapi: 3.1.0
info:
  title: PIM Platform – Attribute creation
  version: 2.0.1
  description: >
    Feature 004 (specs/004-attribute-creation). Creates attribute definitions, one at a time, with a
    data type and type-specific properties (ERF 1.1 §3.2, §3.2.1). Every attribute is global and has
    no groups in this feature (FR-017, FR-018). System IDs come from feature 003 (FR-004); its error
    codes and Spanish messages are passed through unchanged (FR-005). Data is stored in MongoDB and
    survives restarts (ADR 0003, amendment of 2026-11-09). v1.1.0 adds the attribute list
    (GET /api/v1/attributes, feature 005 plan decision D-3). v1.2.0 (feature 007,
    specs/007-attribute-management) adds editing (PUT) and deleting (DELETE) one attribute, and the
    response fields `groups`, `updatedAt` and `listOfValuesProperties.listOfValuesName`; the change
    record is specs/007-attribute-management/contracts/attributes-v1.2.openapi.yaml. v1.3.0 (feature 010,
    specs/010-taxonomy-attribute-inheritance) refuses deleting an attribute assigned to taxonomy nodes
    (409 ATTRIBUTE_ON_TAXONOMY_NODES). v2.0.0 (2026-11-20, owner request) removes the attribute
    description: the request field `description` is no longer read (ignored like any unknown field), the
    response field `description` and the error code INVALID_DESCRIPTION are gone. Unknown fields in request bodies are ignored, as in the rest of
    the API. Messages are in Spanish. v2.0.1 (2026-11-20, owner request, FR-007 amendment) only renames
    the data type labels of GET /api/v1/attribute-types: «Texto (String)», «Numérico (Integer / Float)»,
    «Booleano (Sí/No)», «Lista de Valores (LOV)», «Fecha y Hora (Date/Time)», «Moneda (Currency)»,
    «Referencias / Relaciones». Codes and shapes are unchanged; the user interface shows NUMERIC as two
    choices, «Numérico Entero (Integer)» (numberFormat INTEGER) and «Numérico Decimal (Float)» (DECIMAL).
servers:
  - url: http://localhost:8080
    description: Local development (the frontend reads it from VITE_API_BASE_URL)
tags:
  - name: attributes
  - name: attribute-types
paths:
  /api/v1/attributes:
    get:
      operationId: listAttributes
      summary: Every attribute, sorted by display name ignoring letter case (v1.1.0)
      description: >
        Added for the attribute groups page (feature 005, plan decision D-3). Needs no permission.
        Since v1.2.0 each attribute also carries its groups, its list's name and its last change.
      tags: [attributes]
      responses:
        '200':
          description: The attributes; an empty list when none exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeCollection' }
    post:
      operationId: createAttribute
      summary: Create one attribute definition
      description: >
        Checks, in order: request format and the chosen type's properties (400), permission (403),
        display name (400), list of values (422; then 400 for a missing selection mode
        or list ID), unique display name (409), then asks feature 003 for the system ID (feature 003
        errors: 403, 400, 409). Only the properties object matching `dataType` is read (A-004).
      tags: [attributes]
      parameters:
        - $ref: '#/components/parameters/Permissions'
        - $ref: '#/components/parameters/ManualIdPermissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeCreationRequest' }
            examples:
              text:
                value:
                  displayName: Descripción corta
                  dataType: TEXT
                  textProperties: { minLength: 2, maxLength: 50, caseFormat: UPPERCASE }
              decimal:
                value:
                  displayName: Peso neto
                  dataType: NUMERIC
                  numericProperties: { numberFormat: DECIMAL, precision: 2, minimum: 0, maximum: 999.99 }
              manualId:
                value:
                  systemId: ATR-COLOR
                  displayName: Color
                  dataType: BOOLEAN
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: /api/v1/attributes/{systemId}
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
              example:
                systemId: ATR000001
                displayName: Descripción corta
                dataType: TEXT
                scope: GLOBAL
                textProperties: { minLength: 2, maxLength: 50, caseFormat: UPPERCASE, captureMask: null, richText: false }
                createdAt: '2026-11-09T18:00:00Z'
        '400':
          description: Invalid request or invalid properties for the data type, or a feature 003 `INVALID_SYSTEM_ID`. Nothing saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Solicitud no válida
                status: 400
                detail: La solicitud tiene datos no válidos.
                instance: /api/v1/attributes
                errors:
                  - { field: textProperties.maxLength, code: INVALID_LENGTH_RANGE, message: La longitud mínima no puede ser mayor que la longitud máxima. }
        '403':
          description: No permission to create attributes (`ATTRIBUTE_CREATE_NOT_PERMITTED`), or a manual ID without feature 003's permission (`MANUAL_ID_NOT_PERMITTED`). Nothing saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Sin permiso para crear atributos
                status: 403
                detail: No tienes permiso para crear atributos.
                instance: /api/v1/attributes
                errors:
                  - { field: permissions, code: ATTRIBUTE_CREATE_NOT_PERMITTED, message: No tienes permiso para crear atributos. }
        '409':
          description: Display name already used (`DISPLAY_NAME_IN_USE`), or feature 003 `SYSTEM_ID_IN_USE` / `SEQUENCE_EXHAUSTED`. Nothing saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Nombre en uso
                status: 409
                detail: Ya existe un atributo con el nombre "Color". Usa otro nombre.
                instance: /api/v1/attributes
                errors:
                  - { field: displayName, code: DISPLAY_NAME_IN_USE, message: Ya existe un atributo con el nombre "Color". Usa otro nombre. }
        '422':
          description: List-of-values attribute while no lists exist, or with an unknown list (FR-012). Nothing saved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Lista de valores no disponible
                status: 422
                detail: Aún no existen listas de valores. Un atributo de tipo lista de valores necesita una lista existente.
                instance: /api/v1/attributes
                errors:
                  - { field: listOfValuesProperties.listOfValuesId, code: LIST_OF_VALUES_NOT_AVAILABLE, message: Aún no existen listas de valores. }
  /api/v1/attributes/{systemId}:
    get:
      operationId: getAttribute
      summary: Read one attribute with every property it was created with (FR-021)
      tags: [attributes]
      parameters:
        - name: systemId
          in: path
          required: true
          description: Compared ignoring letter case, as in feature 003.
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: The attribute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        '404':
          description: No attribute has this ID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: No encontrado
                status: 404
                detail: No existe un atributo con el ID ATR999.
                instance: /api/v1/attributes/ATR999
    put:
      operationId: updateAttribute
      summary: Edit an attribute (v1.2.0; feature 007 FR-007 to FR-011, research R-04)
      description: >
        Full replace of the editable fields: display name and the properties of the
        attribute's data type, with the same rules and codes as creation. The body has the creation
        fields; `systemId` is optional and must be the attribute's own (ignoring letter case), and
        `dataType` must be its current type. System ID, data type, scope and creation date never
        change. Order of checks: request (400) → permission (403) → attribute exists (404) → system
        ID and data type unchanged (422) → list-of-values rules (400/422) → display name free among
        the other attributes (409).
      tags: [attributes]
      parameters:
        - name: systemId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/Permissions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeCreationRequest' }
      responses:
        '200':
          description: Saved; the attribute as stored, with `updatedAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attribute' }
        '400':
          description: Invalid display name or property (creation codes). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Without `ATTRIBUTE_CREATE` (`ATTRIBUTE_CHANGE_NOT_PERMITTED`). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No attribute has this ID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Another attribute has the display name (`DISPLAY_NAME_IN_USE`). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            `SYSTEM_ID_IMMUTABLE`, `DATA_TYPE_IMMUTABLE`, `LIST_OF_VALUES_NOT_AVAILABLE` or
            `LIST_OF_VALUES_NOT_FOUND`. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: deleteAttribute
      summary: Delete an attribute that belongs to no group and no taxonomy node (v1.2.0; feature 007 FR-012 to FR-016; v1.3.0 feature 010 FR-021)
      description: >
        Removes the definition. Lists of values, their values, groups and products are not changed.
        The system ID stays registered in feature 003 and is never assigned again.
      tags: [attributes]
      parameters:
        - name: systemId
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
        - $ref: '#/components/parameters/Permissions'
      responses:
        '204':
          description: Deleted.
        '403':
          description: Without `ATTRIBUTE_CREATE` (`ATTRIBUTE_CHANGE_NOT_PERMITTED`). Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No attribute has this ID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: >
            The attribute belongs to groups (`ATTRIBUTE_IN_GROUPS`, problem property `groups`) or, since
            v1.3.0 (feature 010 FR-021), is assigned to taxonomy nodes (`ATTRIBUTE_ON_TAXONOMY_NODES`,
            problem property `nodes`). Groups are checked first. Nothing changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Atributo en grupos
                status: 409
                detail: 'El atributo pertenece a 1 grupo: Logísticos. Quítalo de esos grupos antes de eliminarlo.'
                errors:
                  - { field: groups, code: ATTRIBUTE_IN_GROUPS, message: 'El atributo pertenece a 1 grupo: Logísticos. Quítalo de esos grupos antes de eliminarlo.' }
                groups:
                  - { id: 6f1c0a52-0000-4000-8000-000000000001, name: Logísticos }
  /api/v1/attribute-types:
    get:
      operationId: listAttributeTypes
      summary: The seven data types and the options the creation form offers (FR-007, FR-022)
      tags: [attribute-types]
      responses:
        '200':
          description: The data types, in the order of §3.2.1, with their options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeTypeCollection' }
components:
  parameters:
    Permissions:
      name: X-Pim-Permissions
      in: header
      required: false
      description: >
        Development stand-in for the authenticated user's permissions until authentication exists
        (research R-06). Comma-separated codes; `ATTRIBUTE_CREATE` allows creating attributes.
      schema: { type: string, example: ATTRIBUTE_CREATE }
    ManualIdPermissions:
      name: X-Pim-Manual-Id-Permissions
      in: header
      required: false
      description: Feature 003's development header; `ATTRIBUTE` allows giving a manual system ID.
      schema: { type: string, example: ATTRIBUTE }
  schemas:
    DataType:
      type: string
      enum: [TEXT, NUMERIC, BOOLEAN, LIST_OF_VALUES, DATE_TIME, CURRENCY, REFERENCE]
    TextProperties:
      type: object
      properties:
        minLength: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        maxLength: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        caseFormat: { type: [string, 'null'], enum: [UPPERCASE, LOWERCASE, MIXED_CASE, null] }
        captureMask: { type: [string, 'null'], maxLength: 500, description: Regular expression; must compile }
        richText: { type: boolean, default: false }
    NumericProperties:
      type: object
      required: [numberFormat]
      properties:
        numberFormat: { type: string, enum: [INTEGER, DECIMAL] }
        precision: { type: [integer, 'null'], minimum: 1, maximum: 10, description: Required for DECIMAL; absent for INTEGER }
        minimum: { type: [number, 'null'] }
        maximum: { type: [number, 'null'] }
    ListOfValuesProperties:
      type: object
      description: >
        Both fields are needed to create the attribute, but they are checked after the existence of
        lists (422 LIST_OF_VALUES_NOT_AVAILABLE first), so the schema marks neither as required.
      properties:
        selectionMode: { type: [string, 'null'], enum: [SINGLE, MULTIPLE, null] }
        listOfValuesId: { type: [string, 'null'] }
        listOfValuesName:
          type: string
          readOnly: true
          description: v1.2.0; responses only; the linked list's name, absent if it is not found
    DateTimeProperties:
      type: object
      required: [dateFormat]
      properties:
        dateFormat: { type: string, enum: ['DD/MM/AAAA', 'MM/DD/AAAA', 'AAAA-MM-DD', 'DD/MM/AAAA HH:mm', 'AAAA-MM-DD HH:mm'] }
    CurrencyProperties:
      type: object
      required: [currencyCode]
      properties:
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code }
        decimals: { type: integer, minimum: 0, maximum: 4, default: 2 }
        currencySymbol: { type: string, readOnly: true, description: Derived from the code; responses only }
    ReferenceProperties:
      type: object
      required: [targetObjectType]
      properties:
        targetObjectType: { type: string, enum: [PRODUCT, ATTRIBUTE, LIST_OF_VALUES, TEMPLATE, CLASSIFICATION, INTERFACE] }
        cardinality: { type: string, enum: [SINGLE, MULTIPLE], default: SINGLE }
    AttributeCreationRequest:
      type: object
      required: [displayName, dataType]
      properties:
        systemId: { type: [string, 'null'], maxLength: 60, description: Optional manual ID (feature 003 rules); blank = generate }
        displayName: { type: string, maxLength: 200, description: 'Trimmed; 1–120 characters; unique ignoring letter case' }
        dataType: { type: string, description: One of DataType }
        textProperties: { $ref: '#/components/schemas/TextProperties' }
        numericProperties: { $ref: '#/components/schemas/NumericProperties' }
        listOfValuesProperties: { $ref: '#/components/schemas/ListOfValuesProperties' }
        dateTimeProperties: { $ref: '#/components/schemas/DateTimeProperties' }
        currencyProperties: { $ref: '#/components/schemas/CurrencyProperties' }
        referenceProperties: { $ref: '#/components/schemas/ReferenceProperties' }
    Attribute:
      type: object
      required: [systemId, displayName, dataType, scope, createdAt, groups]
      description: Carries only the properties object matching dataType (none for BOOLEAN).
      properties:
        systemId: { type: string }
        displayName: { type: string }
        dataType: { $ref: '#/components/schemas/DataType' }
        scope: { type: string, enum: [GLOBAL] }
        textProperties: { $ref: '#/components/schemas/TextProperties' }
        numericProperties: { $ref: '#/components/schemas/NumericProperties' }
        listOfValuesProperties: { $ref: '#/components/schemas/ListOfValuesProperties' }
        dateTimeProperties: { $ref: '#/components/schemas/DateTimeProperties' }
        currencyProperties: { $ref: '#/components/schemas/CurrencyProperties' }
        referenceProperties: { $ref: '#/components/schemas/ReferenceProperties' }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: v1.2.0; absent until the first edit
        groups:
          type: array
          description: v1.2.0; the groups containing the attribute, sorted by name ignoring letter case
          items: { $ref: '#/components/schemas/GroupReference' }
    GroupReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Option:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string, description: Spanish label }
    AttributeType:
      type: object
      required: [code, label, options]
      properties:
        code: { $ref: '#/components/schemas/DataType' }
        label: { type: string, example: Texto (String) }
        options:
          type: object
          description: >
            Option lists for this type's properties, keyed by property name: TEXT caseFormat; NUMERIC
            numberFormat; LIST_OF_VALUES selectionMode; DATE_TIME dateFormat; REFERENCE
            targetObjectType and cardinality. Empty for BOOLEAN and CURRENCY.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/Option' }
    AttributeCollection:
      type: object
      description: Project-wide collection envelope (docs/decisions/0001-api-conventions.md).
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Attribute' }
        total: { type: integer }
    AttributeTypeCollection:
      type: object
      description: Project-wide collection envelope (docs/decisions/0001-api-conventions.md).
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AttributeType' }
        total: { type: integer }
    Problem:
      type: object
      description: RFC 9457 Problem Details, used by every API error (ADR 0001).
      required: [title, status]
      properties:
        type: { type: string, description: Omitted when it is "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code:
                type: string
                enum:
                  - REQUIRED
                  - INVALID_DISPLAY_NAME
                  - UNKNOWN_DATA_TYPE
                  - INVALID_LENGTH
                  - INVALID_LENGTH_RANGE
                  - UNKNOWN_CASE_FORMAT
                  - INVALID_CAPTURE_MASK
                  - UNKNOWN_NUMBER_FORMAT
                  - INVALID_PRECISION
                  - INVALID_NUMBER
                  - INVALID_VALUE_RANGE
                  - UNKNOWN_SELECTION_MODE
                  - UNKNOWN_DATE_FORMAT
                  - UNKNOWN_CURRENCY
                  - INVALID_DECIMALS
                  - UNKNOWN_TARGET_OBJECT_TYPE
                  - UNKNOWN_CARDINALITY
                  - ATTRIBUTE_CREATE_NOT_PERMITTED
                  - DISPLAY_NAME_IN_USE
                  - LIST_OF_VALUES_NOT_AVAILABLE
                  - LIST_OF_VALUES_NOT_FOUND
                  - MANUAL_ID_NOT_PERMITTED
                  - INVALID_SYSTEM_ID
                  - SYSTEM_ID_IN_USE
                  - SEQUENCE_EXHAUSTED
                  - ATTRIBUTE_CHANGE_NOT_PERMITTED
                  - SYSTEM_ID_IMMUTABLE
                  - DATA_TYPE_IMMUTABLE
                  - ATTRIBUTE_IN_GROUPS
                  - ATTRIBUTE_ON_TAXONOMY_NODES
              message: { type: string }
        groups:
          type: array
          description: v1.2.0; only with ATTRIBUTE_IN_GROUPS
          items: { $ref: '#/components/schemas/GroupReference' }
        nodes:
          type: array
          description: v1.3.0 (feature 010); only with ATTRIBUTE_ON_TAXONOMY_NODES; the nodes listing the attribute, sorted by name
          items:
            type: object
            required: [systemId, name]
            properties:
              systemId: { type: string, example: CLS000001 }
              name: { type: string, example: Ropa }
