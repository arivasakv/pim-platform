spring:
  application:
    name: backend
  mvc:
    # Framework errors use RFC 9457 Problem Details too (docs/decisions/0001-api-conventions.md).
    problemdetails:
      enabled: true

pim:
  cors:
    # Comma-separated browser origins allowed to call /api/**. Override per environment with the
    # PIM_CORS_ALLOWED_ORIGINS environment variable (constitution VIII).
    allowed-origins: ${PIM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
