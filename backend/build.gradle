plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	// Java formatter (constitution V; plan decision D-2)
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.pim'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Bean Validation for request parameters (constitution VII; plan decision D-3)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Product catalog stored in MongoDB (constitution IX 2.2.0; ADR 0002)
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	// Reads Excel (.xlsx) bulk loads of lists of values and writes their template (feature 013 decision D-1)
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// `spotlessCheck` runs as part of `check` (and therefore `build`); `spotlessApply` formats.
spotless {
	java {
		target 'src/*/java/**/*.java'
		palantirJavaFormat('2.103.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// Static check: every compiler warning in main sources fails the build (plan decision D-2).
tasks.named('compileJava') {
	options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.named('test') {
	useJUnitPlatform()
}
